<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Center">
<title>🎮 Game Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.06);
    --text: #f0f0f5;
    --text-dim: rgba(255,255,255,0.4);
    --radius: 20px;
    --radius-sm: 14px;
    /* game colors */
    --c-2048: #f59e0b;
    --c-snake: #10b981;
    --c-tetris: #6366f1;
    --c-blackjack: #ef4444;
    --c-slingshot: #f97316;
    --c-puzzle: #ec4899;
    --c-rhythm: #8b5cf6;
    --c-breakout: #06b6d4;
    --c-sudoku: #14b8a6;
    --c-striker: #ff4080;;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
    display: flex;
    flex-direction: column;
  }

  /* Background noise */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(236,72,153,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(16,185,129,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 1;
    padding: 24px 8px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-icon {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 40px rgba(99,102,241,0.3);
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f0f0f5 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-text p {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 400;
  }

  /* Games Grid */
  .games-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 8px 0 80px;
    flex: 1;
    align-content: start;
  }

  .game-card {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.3s;
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    -webkit-user-select: none;
  }
  .game-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .game-card:active {
    transform: scale(0.94);
  }
  .game-card .icon {
    font-size: 34px;
    line-height: 1;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
  }
  .game-card .name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-align: center;
    line-height: 1.2;
    position: relative;
    z-index: 1;
    opacity: 0.8;
  }

  /* Per-game card styles */
  .game-card[data-game="2048"] .icon { color: var(--c-2048); }
  .game-card[data-game="2048"]:active { background: rgba(245,158,11,0.08); }
  .game-card[data-game="2048"]::before { background: linear-gradient(135deg, rgba(245,158,11,0.1), transparent); }

  .game-card[data-game="snake"] .icon { color: var(--c-snake); }
  .game-card[data-game="snake"]:active { background: rgba(16,185,129,0.08); }

  .game-card[data-game="tetris"] .icon { color: var(--c-tetris); }
  .game-card[data-game="tetris"]:active { background: rgba(99,102,241,0.08); }

  .game-card[data-game="blackjack"] .icon { color: var(--c-blackjack); }
  .game-card[data-game="blackjack"]:active { background: rgba(239,68,68,0.08); }

  .game-card[data-game="slingshot"] .icon { color: var(--c-slingshot); }
  .game-card[data-game="slingshot"]:active { background: rgba(249,115,22,0.08); }

  .game-card[data-game="puzzle"] .icon { color: var(--c-puzzle); }
  .game-card[data-game="puzzle"]:active { background: rgba(236,72,153,0.08); }

  .game-card[data-game="rhythm"] .icon { color: var(--c-rhythm); }
  .game-card[data-game="rhythm"]:active { background: rgba(139,92,246,0.08); }

  .game-card[data-game="breakout"] .icon { color: var(--c-breakout); }
  .game-card[data-game="breakout"]:active { background: rgba(6,182,212,0.08); }

  .game-card[data-game="sudoku"] .icon { color: var(--c-sudoku); }
  .game-card[data-game="sudoku"]:active { background: rgba(20,184,166,0.08); }

  .game-card[data-game="striker"] .icon { color: var(--c-striker); }
  .game-card[data-game="striker"]:active { background: rgba(255,64,128,0.08); }

  /* Footer */
  footer {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  footer p {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* Entry animation */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .game-card {
    animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .game-card:nth-child(1) { animation-delay: 0.02s; }
  .game-card:nth-child(2) { animation-delay: 0.06s; }
  .game-card:nth-child(3) { animation-delay: 0.10s; }
  .game-card:nth-child(4) { animation-delay: 0.14s; }
  .game-card:nth-child(5) { animation-delay: 0.18s; }
  .game-card:nth-child(6) { animation-delay: 0.22s; }
  .game-card:nth-child(7) { animation-delay: 0.26s; }
  .game-card:nth-child(8) { animation-delay: 0.30s; }
  .game-card:nth-child(9) { animation-delay: 0.34s; }

  /* Responsive */
  @media (min-width: 500px) {
    .games-grid { grid-template-columns: repeat(4, 1fr); max-width: 480px; margin: 0 auto; }
    .game-card .icon { font-size: 40px; }
    .game-card .name { font-size: 12px; }
  }
  @media (max-width: 370px) {
    .games-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .game-card .icon { font-size: 28px; }
    .game-card .name { font-size: 10px; }
  }

  /* Loading overlay when navigating */
  .loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .loading.active { opacity: 1; pointer-events: all; }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading" id="loading"><div class="loading-spinner"></div></div>

<header>
  <div class="header-icon">🎮</div>
  <div class="header-text">
    <h1>Game Center</h1>
    <p>9 款小游戏 · 触手可及</p>
  </div>
</header>

<div class="games-grid">
  <a class="game-card" data-game="2048" href="games/2048.html">
    <span class="icon">🔢</span>
    <span class="name">2048</span>
  </a>
  <a class="game-card" data-game="snake" href="games/snake.html">
    <span class="icon">🐍</span>
    <span class="name">贪吃蛇</span>
  </a>
  <a class="game-card" data-game="tetris" href="games/tetris.html">
    <span class="icon">🔲</span>
    <span class="name">俄罗斯方块</span>
  </a>
  <a class="game-card" data-game="blackjack" href="games/blackjack.html">
    <span class="icon">🃏</span>
    <span class="name">21 点</span>
  </a>
  <a class="game-card" data-game="slingshot" href="games/slingshot.html">
    <span class="icon">🎯</span>
    <span class="name">弹射小怪</span>
  </a>
  <a class="game-card" data-game="puzzle" href="games/puzzle.html">
    <span class="icon">🧩</span>
    <span class="name">滑动拼图</span>
  </a>
  <a class="game-card" data-game="rhythm" href="games/rhythm.html">
    <span class="icon">🎵</span>
    <span class="name">节奏点按</span>
  </a>
  <a class="game-card" data-game="breakout" href="games/breakout.html">
    <span class="icon">🏓</span>
    <span class="name">打砖块</span>
  </a>
  <a class="game-card" data-game="sudoku" href="games/sudoku.html">
    <span class="icon">🧮</span>
    <span class="name">数独</span>
  </a>
  <a class="game-card" data-game="striker" href="games/striker.html">
    <span class="icon">🚀</span>
    <span class="name">星际防线</span>
  </a>
  <a class="game-card" data-game="watermelon" href="games/watermelon.html">
    <span class="icon">🍉</span>
    <span class="name">合成大西瓜</span>
  </a>
</div>

<footer><p>点击游戏卡片开始 · 手指专属体验</p></footer>

<script>
  // Transition overlay when navigating
  document.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', e => {
      const loading = document.getElementById('loading');
      loading.classList.add('active');
    });
  });
</script>

</body>
</html>
