<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🧩 滑动拼图</title>
<style>
:root{--bg:#0a0a12;--surface:rgba(255,255,255,0.04);--text:#f0f0f5;--accent:#ec4899;--accent-dim:rgba(236,72,153,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
body{padding:env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);display:flex;flex-direction:column;align-items:center;}
.top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--text);opacity:0.6;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:12px;}
.back-btn:active{background:var(--surface);opacity:1;}
.game-title{font-size:20px;font-weight:800;}
.game-title span{background:linear-gradient(135deg,#ec4899,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.score-display{font-size:14px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:8px 16px;border-radius:20px;}
.ctrl-row{display:flex;gap:12px;padding:12px 0;flex-shrink:0;}
.ctrl-btn{border:1px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text);padding:10px 24px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;}
.ctrl-btn:active{background:var(--accent-dim);border-color:var(--accent);}
.game-container{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
canvas{background:#0f0f1a;border-radius:16px;border:1px solid rgba(255,255,255,0.06);max-width:100%;max-height:100%;box-shadow:0 0 40px rgba(236,72,153,0.06);}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.overlay.show{display:flex;}
.overlay-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#ec4899,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.overlay-score{font-size:16px;opacity:0.7;}
.overlay-btn{background:var(--accent);color:#000;font-weight:800;padding:14px 40px;border-radius:30px;font-size:16px;border:none;cursor:pointer;}
.overlay-btn:active{transform:scale(0.95);}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="game-title"><span>🧩 滑动拼图</span></div>
  <div class="score-display">步数: <span id="moves">0</span></div>
</div>
<div class="game-container"><canvas id="gameCanvas"></canvas></div>
<div class="ctrl-row">
  <button class="ctrl-btn" id="shuffleBtn">🔀 打乱</button>
  <button class="ctrl-btn" id="gridBtn">3×3</button>
</div>
<div class="overlay" id="gameOver">
  <div class="overlay-title">🎉 完成!</div>
  <div class="overlay-score">用了 <span id="finalMoves">0</span> 步</div>
  <button class="ctrl-btn" id="restartBtn" style="font-size:16px;padding:14px 40px;">🔄 再来一局</button>
</div>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const movesEl=document.getElementById('moves'),finalMovesEl=document.getElementById('finalMoves');
const overlay=document.getElementById('gameOver'),shuffleBtn=document.getElementById('shuffleBtn');
const gridBtn=document.getElementById('gridBtn'),restartBtn=document.getElementById('restartBtn');
let N=3,tiles=[],empty={r:0,c:0},moves=0,size,cs;

function resize(){
  const c=canvas.parentElement;
  const s=Math.min(c.clientWidth-8,c.clientHeight-8,380);
  canvas.width=canvas.height=s;size=s;cs=s/N;
}

function init(){
  resize();moves=0;movesEl.textContent='0';overlay.classList.remove('show');
  gridBtn.textContent=N+'×'+N;
  tiles=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>r*N+c+1));
  tiles[N-1][N-1]=0;empty={r:N-1,c:N-1};
  shuffleTiles(100);
  draw();
}

function shuffleTiles(n){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let i=0;i<n;i++){
    const avail=[];
    for(const[dr,dc]of dirs){
      const nr=empty.r+dr,nc=empty.c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N)avail.push({r:nr,c:nc});
    }
    if(!avail.length)continue;
    const pick=avail[Math.floor(Math.random()*avail.length)];
    tiles[empty.r][empty.c]=tiles[pick.r][pick.c];
    tiles[pick.r][pick.c]=0;
    empty={r:pick.r,c:pick.c};
  }
  moves=0;movesEl.textContent='0';
}

function isSolved(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(r===N-1&&c===N-1){if(tiles[r][c]!==0)return false;}
    else if(tiles[r][c]!==r*N+c+1)return false;
  }
  return true;
}

function slide(r,c){
  if(Math.abs(r-empty.r)+Math.abs(c-empty.c)!==1||tiles[r][c]===0)return;
  tiles[empty.r][empty.c]=tiles[r][c];
  tiles[r][c]=0;
  empty={r,c};
  moves++;movesEl.textContent=moves;
  draw();
  if(isSolved()){finalMovesEl.textContent=moves;setTimeout(()=>overlay.classList.add('show'),300);}
}

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*size/rect.width;
  const y=(e.clientY-rect.top)*size/rect.height;
  const c=Math.floor(x/cs),r=Math.floor(y/cs);
  if(r>=0&&r<N&&c>=0&&c<N)slide(r,c);
});

canvas.addEventListener('touchstart',e=>{
  const t=e.touches[0],rect=canvas.getBoundingClientRect();
  const x=(t.clientX-rect.left)*size/rect.width;
  const y=(t.clientY-rect.top)*size/rect.height;
  const c=Math.floor(x/cs),r=Math.floor(y/cs);
  if(r>=0&&r<N&&c>=0&&c<N)slide(r,c);
},{passive:true});

shuffleBtn.addEventListener('click',()=>shuffleTiles(50));
gridBtn.addEventListener('click',()=>{N=N===3?4:3;init();});
restartBtn.addEventListener('click',init);
window.addEventListener('resize',()=>{resize();draw();});

const colors=['#ef4444','#f97316','#f59e0b','#10b981','#06b6d4','#6366f1','#8b5cf6','#ec4899','#f43f5e','#14b8a6','#eab308','#84cc16','#22c55e','#3b82f6','#a855f7','#d946ef'];

function draw(){
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle='#0f0f1a';ctx.beginPath();ctx.roundRect(0,0,size,size,16);ctx.fill();
  const pad=2;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const v=tiles[r][c];
    if(v===0)continue;
    const x=c*cs+pad,y=r*cs+pad,w=cs-pad*2;
    ctx.shadowColor=colors[(v-1)%colors.length];ctx.shadowBlur=8;
    ctx.fillStyle=colors[(v-1)%colors.length];
    ctx.beginPath();ctx.roundRect(x,y,w,w,8);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${cs*0.38}px Inter,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(v,x+w/2,y+w/2);
  }
}
init();
</script>
</body>
</html>
