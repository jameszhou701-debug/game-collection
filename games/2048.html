<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🔢 2048</title>
<style>
  :root {
    --bg: #0a0a12; --surface: rgba(255,255,255,0.04); --text: #f0f0f5; --text-dim: rgba(255,255,255,0.4);
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,0.15);
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system, Inter, sans-serif; background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased; }
  body { padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,12px) env(safe-area-inset-bottom,12px) env(safe-area-inset-left,12px); display:flex; flex-direction:column; align-items:center; }
  .top-bar { width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 4px; flex-shrink:0; }
  .back-btn { display:flex; align-items:center; gap:6px; color:var(--text); opacity:0.6; text-decoration:none; font-size:14px; font-weight:600; padding:8px 12px; border-radius:12px; }
  .back-btn:active { background:var(--surface); opacity:1; }
  .game-title { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  .game-title span { background:linear-gradient(135deg,#f59e0b,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .score-row { display:flex; gap:8px; }
  .score-box { background:var(--accent-dim); padding:6px 14px; border-radius:12px; text-align:center; }
  .score-box .label { font-size:9px; text-transform:uppercase; opacity:0.5; letter-spacing:1px; }
  .score-box .value { font-size:16px; font-weight:800; color:var(--accent); }

  .game-container { flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
  #gridCanvas { background:#0f0f1a; border-radius:16px; border:1px solid rgba(255,255,255,0.06); max-width:100%; max-height:100%; box-shadow:0 0 40px rgba(245,158,11,0.06); }

  .hint { font-size:12px; color:var(--text-dim); padding:8px 0; text-align:center; flex-shrink:0; }

  .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  .overlay.show { display:flex; }
  .overlay-title { font-size:32px; font-weight:900; background:linear-gradient(135deg,#f59e0b,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .overlay-score { font-size:16px; color:var(--text); opacity:0.7; }
  .overlay-btn { background:var(--accent); color:#000; font-weight:800; padding:14px 40px; border-radius:30px; font-size:16px; border:none; cursor:pointer; }
  .overlay-btn:active { transform:scale(0.95); }
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="game-title"><span>🔢 2048</span></div>
  <div class="score-row">
    <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">Best</div><div class="value" id="bestScore">0</div></div>
  </div>
</div>
<div class="game-container"><canvas id="gridCanvas"></canvas></div>
<div class="hint">滑动屏幕 / 方向键移动</div>
<div class="overlay" id="gameOver">
  <div class="overlay-title" id="resultTitle">🎉 You Win!</div>
  <div class="overlay-score">得分: <span id="finalScore">0</span></div>
  <button class="overlay-btn" id="restartBtn">🔄 再来一局</button>
</div>

<script>
  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestScoreEl = document.getElementById('bestScore');
  const finalScoreEl = document.getElementById('finalScore');
  const resultTitle = document.getElementById('resultTitle');
  const overlay = document.getElementById('gameOver');
  const restartBtn = document.getElementById('restartBtn');

  let grid = [], size = 4, score = 0, bestScore = parseInt(localStorage.getItem('2048best') || '0');
  let cellSize = 0, padding = 0;
  let won = false, gameOver = false;

  bestScoreEl.textContent = bestScore;

  function resize() {
    const container = canvas.parentElement;
    const maxSize = Math.min(container.clientWidth - 8, container.clientHeight - 8, 400);
    canvas.width = canvas.height = maxSize;
    cellSize = (maxSize - 20) / size;
    padding = 10;
  }

  function addRandom() {
    const empty = [];
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (!grid[r][c]) empty.push({r,c});
    if (empty.length) {
      const {r,c} = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
  }

  function initGrid() {
    grid = Array.from({length: size}, () => Array(size).fill(0));
    score = 0; won = false; gameOver = false;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    addRandom(); addRandom();
    draw();
  }

  function slide(row) {
    let arr = row.filter(v => v);
    let scoreGain = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] && arr[i] === arr[i+1]) {
        arr[i] *= 2; scoreGain += arr[i]; arr.splice(i+1, 1); i--;
      }
    }
    while (arr.length < size) arr.push(0);
    return {arr, scoreGain};
  }

  function move(direction) {
    if (gameOver || won) return;
    let moved = false, totalScore = 0;
    const newGrid = Array.from({length: size}, () => Array(size).fill(0));

    if (direction === 'left') {
      for (let r = 0; r < size; r++) {
        const {arr, scoreGain} = slide(grid[r]);
        for (let c = 0; c < size; c++) { if (grid[r][c] !== arr[c]) moved = true; newGrid[r][c] = arr[c]; }
        totalScore += scoreGain;
      }
    } else if (direction === 'right') {
      for (let r = 0; r < size; r++) {
        const {arr, scoreGain} = slide(grid[r].slice().reverse());
        arr.reverse();
        for (let c = 0; c < size; c++) { if (grid[r][c] !== arr[c]) moved = true; newGrid[r][c] = arr[c]; }
        totalScore += scoreGain;
      }
    } else if (direction === 'up') {
      for (let c = 0; c < size; c++) {
        const col = grid.map(r => r[c]);
        const {arr, scoreGain} = slide(col);
        for (let r = 0; r < size; r++) { if (grid[r][c] !== arr[r]) moved = true; newGrid[r][c] = arr[r]; }
        totalScore += scoreGain;
      }
    } else if (direction === 'down') {
      for (let c = 0; c < size; c++) {
        const col = grid.map(r => r[c]).reverse();
        const {arr, scoreGain} = slide(col);
        arr.reverse();
        for (let r = 0; r < size; r++) { if (grid[r][c] !== arr[r]) moved = true; newGrid[r][c] = arr[r]; }
        totalScore += scoreGain;
      }
    }
    if (!moved) return;
    grid = newGrid;
    score += totalScore;
    scoreEl.textContent = score;
    if (score > bestScore) { bestScore = score; bestScoreEl.textContent = score; localStorage.setItem('2048best', score); }
    addRandom();
    draw();
    checkGameOver();
  }

  function checkGameOver() {
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (grid[r][c] === 2048 && !won) {
      won = true;
      resultTitle.textContent = '🎉 You Win!';
      finalScoreEl.textContent = score;
      overlay.classList.add('show');
      return;
    }
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (grid[r][c] === 0) return;
      if (c+1 < size && grid[r][c] === grid[r][c+1]) return;
      if (r+1 < size && grid[r][c] === grid[r+1][c]) return;
    }
    gameOver = true;
    resultTitle.textContent = '💀 Game Over';
    finalScoreEl.textContent = score;
    overlay.classList.add('show');
  }

  const tileColors = {
    0:'transparent', 2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563',
    32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72', 256:'#edcc61', 512:'#edc850',
    1024:'#edc53f', 2048:'#edc22e', 4096:'#3c3a32'
  };
  const textColors = {0:'transparent',2:'#776e65',4:'#776e65',8:'#f9f6f2',16:'#f9f6f2',32:'#f9f6f2',64:'#f9f6f2',128:'#f9f6f2',256:'#f9f6f2',512:'#f9f6f2',1024:'#f9f6f2',2048:'#f9f6f2'};

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Background
    ctx.fillStyle = '#0f0f1a'; ctx.beginPath(); ctx.roundRect(0,0,canvas.width,canvas.height,16); ctx.fill();
    const gap = 4;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      const val = grid[r][c];
      const x = padding + c * cellSize + gap;
      const y = padding + r * cellSize + gap;
      const w = cellSize - gap * 2;
      ctx.fillStyle = tileColors[val] || '#3c3a32';
      ctx.shadowColor = val >= 128 ? 'rgba(237,207,114,0.3)' : 'transparent';
      ctx.shadowBlur = val >= 128 ? 12 : 0;
      ctx.beginPath(); ctx.roundRect(x, y, w, w, 6); ctx.fill();
      ctx.shadowBlur = 0;
      if (val) {
        ctx.fillStyle = textColors[val] || '#f9f6f2';
        ctx.font = `bold ${cellSize * (val < 1000 ? 0.45 : val < 100000 ? 0.35 : 0.28)}px Inter, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(val, x + w/2, y + w/2);
      }
    }
  }

  // Swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; touchStart = {x: t.clientX, y: t.clientY}; }, {passive:true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, {passive:true});

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  restartBtn.addEventListener('click', initGrid);
  window.addEventListener('resize', () => { resize(); draw(); });

  resize(); initGrid();
</script>
</body>
</html>
