<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🔲 俄罗斯方块</title>
<style>
:root{--bg:#0a0a12;--surface:rgba(255,255,255,0.04);--text:#f0f0f5;--accent:#6366f1;--accent-dim:rgba(99,102,241,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
body{padding:env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);display:flex;flex-direction:column;align-items:center;}
.top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--text);opacity:0.6;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:12px;}
.back-btn:active{background:var(--surface);opacity:1;}
.game-title{font-size:20px;font-weight:800;}
.game-title span{background:linear-gradient(135deg,#6366f1,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.info-row{display:flex;gap:8px;flex-shrink:0;}
.info-box{background:var(--accent-dim);padding:4px 12px;border-radius:10px;text-align:center;}
.info-box .lbl{font-size:9px;text-transform:uppercase;opacity:0.5;letter-spacing:1px;}
.info-box .val{font-size:14px;font-weight:800;color:var(--accent);}
.game-area{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
canvas{background:#0f0f1a;border-radius:12px;border:1px solid rgba(255,255,255,0.06);}
#boardCanvas{max-height:100%;}
#nextCanvas{max-height:80px;max-width:80px;}
.ctrl-bank{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;flex-shrink:0;max-width:240px;}
.ctrl-bank button{border:1px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text);font-size:20px;padding:12px 0;border-radius:10px;cursor:pointer;}
.ctrl-bank button:active{background:var(--accent-dim);border-color:var(--accent);transform:scale(0.92);}
.ctrl-bank button:nth-child(2){font-size:14px;font-weight:700;}
.ctrl-bank button:nth-child(5){font-size:24px;}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.overlay.show{display:flex;}
.overlay-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#6366f1,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.overlay-score{font-size:16px;opacity:0.7;}
.overlay-btn{background:var(--accent);color:#000;font-weight:800;padding:14px 40px;border-radius:30px;font-size:16px;border:none;cursor:pointer;}
.overlay-btn:active{transform:scale(0.95);}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="game-title"><span>🔲 俄罗斯方块</span></div>
  <div class="info-row">
    <div class="info-box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    <div class="info-box"><div class="lbl">Level</div><div class="val" id="level">1</div></div>
    <div class="info-box"><div class="lbl">Lines</div><div class="val" id="lines">0</div></div>
  </div>
</div>
<div class="game-area">
  <canvas id="boardCanvas"></canvas>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <span style="font-size:10px;opacity:0.4;">NEXT</span>
    <canvas id="nextCanvas"></canvas>
  </div>
</div>
<div class="ctrl-bank">
  <button id="btnLeft">⬅️</button>
  <button id="btnRotate">↻</button>
  <button id="btnRight">➡️</button>
  <button id="btnDrop">⬇️</button>
  <button id="btnHardDrop">⏬</button>
  <button id="btnPause">II</button>
</div>
<div class="overlay" id="gameOver">
  <div class="overlay-title" id="resultTitle">💀 Game Over</div>
  <div class="overlay-score">得分: <span id="finalScore">0</span> · 消除 <span id="finalLines">0</span> 行</div>
  <button class="overlay-btn" id="restartBtn">🔄 再来一局</button>
</div>

<script>
const bc=document.getElementById('boardCanvas'),bctx=bc.getContext('2d');
const nc=document.getElementById('nextCanvas'),nctx=nc.getContext('2d');
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level');
const linesEl=document.getElementById('lines'),finalScoreEl=document.getElementById('finalScore');
const finalLinesEl=document.getElementById('finalLines'),resultTitle=document.getElementById('resultTitle');
const overlay=document.getElementById('gameOver'),restartBtn=document.getElementById('restartBtn');
const ROWS=20,COLS=10;
let board,piece,nextPiece,score,level,lines,running,paused,dropTimer,animId,cellSize,bH,bW;

const PIECES=[
  {shape:[[1,1,1,1]],color:'#06b6d4'},           // I
  {shape:[[1,1],[1,1]],color:'#f59e0b'},          // O
  {shape:[[1,1,1],[0,1,0]],color:'#8b5cf6'},      // T
  {shape:[[1,1,1],[1,0,0]],color:'#f97316'},      // L
  {shape:[[1,1,1],[0,0,1]],color:'#6366f1'},      // J
  {shape:[[1,1,0],[0,1,1]],color:'#10b981'},      // S
  {shape:[[0,1,1],[1,1,0]],color:'#ef4444'},      // Z
];

function randomPiece(){return JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random()*PIECES.length)]));}

function resize(){
  const p=bc.parentElement;
  const bh=p.clientHeight-4,bw=p.clientWidth-96;
  const mw=Math.min(bw,bh*COLS/ROWS,200);
  bW=Math.floor(mw);bH=Math.floor(mw*ROWS/COLS);
  bc.width=bW;bc.height=bH;
  nc.width=80;nc.height=80;
  cellSize=bW/COLS;
}

function createPiece(p){
  return{shape:p.shape.map(r=>[...r]),color:p.color,x:Math.floor((COLS-p.shape[0].length)/2),y:0};
}

function init(){
  resize();board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=0;level=1;lines=0;running=true;paused=false;
  scoreEl.textContent='0';levelEl.textContent='1';linesEl.textContent='0';
  overlay.classList.remove('show');
  nextPiece=randomPiece();
  spawnPiece();
  if(animId)cancelAnimationFrame(animId);
  dropTimer=0;loop(0);
}

function spawnPiece(){
  piece=createPiece(nextPiece);
  nextPiece=randomPiece();
  if(collides(piece.shape,piece.x,piece.y)){running=false;finalScoreEl.textContent=score;finalLinesEl.textContent=lines;resultTitle.textContent='💀 Game Over';overlay.classList.add('show');}
}

function collides(shape,px,py){
  for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++){
    if(!shape[r][c])continue;
    const bx=px+c,by=py+r;
    if(bx<0||bx>=COLS||by>=ROWS)return true;
    if(by>=0&&board[by][bx])return true;
  }
  return false;
}

function lockPiece(){
  const s=piece.shape;
  for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
    if(!s[r][c])continue;
    const by=piece.y+r,bx=piece.x+c;
    if(by>=0&&by<ROWS&&bx>=0&&bx<COLS)board[by][bx]=piece.color;
  }
  clearLines();
  spawnPiece();
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c!==0)){
      board.splice(r,1);board.unshift(Array(COLS).fill(0));
      cleared++;r++;
    }
  }
  if(cleared>0){
    lines+=cleared;linesEl.textContent=lines;
    const pts=[0,100,300,500,800];
    score+=pts[Math.min(cleared,4)]*level;
    scoreEl.textContent=score;
    level=Math.floor(lines/10)+1;levelEl.textContent=level;
  }
}

function movePiece(dx,dy){
  if(!running||paused)return;
  if(!collides(piece.shape,piece.x+dx,piece.y+dy)){piece.x+=dx;piece.y+=dy;return true;}
  if(dy>0){lockPiece();}
  return false;
}

function rotatePiece(){
  if(!running||paused)return;
  const s=piece.shape;
  const rotated=s[0].map((_,i)=>s.map(r=>r[i]).reverse());
  let ox=piece.x,oy=piece.y;
  if(!collides(rotated,ox,oy)){piece.shape=rotated;return;}
  // wall kick
  for(const kick of[-1,1,-2,2]){
    if(!collides(rotated,ox+kick,oy)){piece.shape=rotated;piece.x+=kick;return;}
  }
}

function hardDrop(){
  if(!running||paused)return;
  while(!collides(piece.shape,piece.x,piece.y+1))piece.y++;
  lockPiece();
}

function togglePause(){
  if(!running)return;paused=!paused;
  document.getElementById('btnPause').textContent=paused?'▶':'II';
}

function update(dt){
  if(!running||paused)return;
  dropTimer+=dt;
  const speed=Math.max(0.05,0.8-level*0.07);
  if(dropTimer>speed){movePiece(0,1);dropTimer=0;}
}

function drawBoard(){
  bctx.clearRect(0,0,bW,bH);
  bctx.fillStyle='#0f0f1a';bctx.beginPath();bctx.roundRect(0,0,bW,bH,12);bctx.fill();
  // grid
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]){
      bctx.shadowColor=board[r][c];bctx.shadowBlur=4;
      bctx.fillStyle=board[r][c];
      bctx.beginPath();bctx.roundRect(c*cellSize+0.5,r*cellSize+0.5,cellSize-1,cellSize-1,3);bctx.fill();
    }
  }
  bctx.shadowBlur=0;
  // piece
  if(piece&&running){
    const s=piece.shape;
    for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
      if(!s[r][c])continue;
      const x=(piece.x+c)*cellSize,y=(piece.y+r)*cellSize;
      bctx.shadowColor=piece.color;bctx.shadowBlur=6;
      bctx.fillStyle=piece.color;
      bctx.beginPath();bctx.roundRect(x+0.5,y+0.5,cellSize-1,cellSize-1,3);bctx.fill();
    }
    bctx.shadowBlur=0;
    // ghost
    let gy=piece.y;
    while(!collides(piece.shape,piece.x,gy+1))gy++;
    if(gy!==piece.y){
      for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
        if(!s[r][c])continue;
        const x=(piece.x+c)*cellSize,y=(gy+r)*cellSize;
        bctx.strokeStyle=piece.color;bctx.globalAlpha=0.2;bctx.lineWidth=1;
        bctx.beginPath();bctx.roundRect(x+1,y+1,cellSize-2,cellSize-2,3);bctx.stroke();
        bctx.globalAlpha=1;
      }
    }
  }
  if(paused){
    bctx.fillStyle='rgba(0,0,0,0.6)';bctx.fillRect(0,0,bW,bH);
    bctx.fillStyle='#fff';bctx.font='bold 24px sans-serif';bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText('⏸',bW/2,bH/2);
  }
}

function drawNext(){
  nctx.clearRect(0,0,80,80);
  nctx.fillStyle='#0f0f1a';nctx.beginPath();nctx.roundRect(0,0,80,80,8);nctx.fill();
  if(!nextPiece)return;
  const s=nextPiece.shape,cs=60/Math.max(s.length,s[0].length);
  const ox=(80-s[0].length*cs)/2,oy=(80-s.length*cs)/2;
  for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
    if(!s[r][c])continue;
    nctx.shadowColor=nextPiece.color;nctx.shadowBlur=4;
    nctx.fillStyle=nextPiece.color;
    nctx.beginPath();nctx.roundRect(ox+c*cs+1,oy+r*cs+1,cs-2,cs-2,3);nctx.fill();
  }
  nctx.shadowBlur=0;
}

let lastT=0;
function loop(t){
  if(lastT===0)lastT=t;
  update((t-lastT)/1000);lastT=t;
  drawBoard();drawNext();
  animId=requestAnimationFrame(loop);
}

// Controls
document.getElementById('btnLeft').addEventListener('click',()=>movePiece(-1,0));
document.getElementById('btnRight').addEventListener('click',()=>movePiece(1,0));
document.getElementById('btnDrop').addEventListener('click',()=>movePiece(0,1));
document.getElementById('btnRotate').addEventListener('click',rotatePiece);
document.getElementById('btnHardDrop').addEventListener('click',hardDrop);
document.getElementById('btnPause').addEventListener('click',togglePause);
// Swipe
let sx=0;
bc.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
bc.addEventListener('touchend',e=>{
  if(!running||paused)return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)<20)rotatePiece();
  else if(dx>0)movePiece(1,0);
  else movePiece(-1,0);
},{passive:true});

document.addEventListener('keydown',e=>{
  if(!running)return;
  const map={ArrowLeft:()=>movePiece(-1,0),ArrowRight:()=>movePiece(1,0),ArrowDown:()=>movePiece(0,1),
    ArrowUp:rotatePiece,' ':hardDrop,'p':togglePause};
  if(map[e.key]){e.preventDefault();map[e.key]();}
});

restartBtn.addEventListener('click',init);
window.addEventListener('resize',()=>{resize();if(!running)drawBoard();});
init();
</script>
</body>
</html>
