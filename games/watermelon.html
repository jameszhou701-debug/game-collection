<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍉 合成大西瓜</title>
<style>
:root{--bg:#1a1a2e;--surface:rgba(255,255,255,0.04);--text:#e8e8f0;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,8px) 8px 0;}
.top-bar{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:6px 4px;flex-shrink:0;}
.back-btn{color:var(--text);opacity:0.5;text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;}
.back-btn:active{opacity:0.8;}
.title{font-size:19px;font-weight:800;letter-spacing:-0.3px;}
.title span{background:linear-gradient(135deg,#f97316,#ef4444,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.score-box{font-size:13px;font-weight:700;color:#f97316;background:rgba(249,115,22,0.1);padding:7px 14px;border-radius:16px;border:1px solid rgba(249,115,22,0.15);}
.game-wrap{position:relative;width:100%;max-width:420px;aspect-ratio:0.55;margin:4px 0;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);background:#0f0f1a;}
canvas{display:block;width:100%;height:100%;}
.next-preview{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.next-label{font-size:10px;opacity:0.4;font-weight:600;}
.next-fruit{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(6,6,20,0.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.overlay.show{display:flex;}
.overlay-emoji{font-size:48px;}
.overlay-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.overlay-score{font-size:15px;opacity:0.6;}
.overlay-btn{padding:12px 36px;border-radius:24px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-weight:800;font-size:16px;border:none;cursor:pointer;transition:all 0.12s;}
.overlay-btn:active{transform:scale(0.92);}
.ctrl-hint{font-size:11px;opacity:0.25;padding:4px 0;flex-shrink:0;}
.fruits-row{display:flex;gap:4px;padding:4px 0;flex-shrink:0;flex-wrap:wrap;justify-content:center;}
.fruit-dot{font-size:16px;opacity:0.4;}
.leaderboard{position:absolute;left:10px;top:16px;display:flex;flex-direction:column;gap:2px;z-index:5;}
.lb-title{font-size:9px;opacity:0.3;font-weight:700;text-align:center;margin-bottom:2px;}
.lb-row{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;}
.lb-rank{width:14px;text-align:center;opacity:0.5;}
.lb-score{color:#f97316;opacity:0.7;}
.lb-row.highlight{color:#f97316;font-weight:800;}
.lb-row.highlight .lb-score{opacity:1;}

</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="title"><span>🍉 合成大西瓜</span></div>
  <div class="score-box">🏆 <span id="score">0</span></div>
</div>
<div class="game-wrap" id="gameWrap">
  <canvas id="gc"></canvas>
  <div class="next-preview"><span class="next-label">NEXT</span><span class="next-fruit" id="nextFruit">🍒</span></div>
  <div class="leaderboard" id="leaderboard"><div class="lb-title">🏆 排行榜</div></div>
  <div class="overlay" id="overlay">
    <div class="overlay-emoji">🍉</div>
    <div class="overlay-title">Game Over</div>
    <div class="overlay-score">得分: <span id="finalScore">0</span></div>
    <button class="overlay-btn" id="restartBtn">🔄 再来一次</button>
  </div>
</div>
<p class="ctrl-hint">👆 左右拖动选择位置 · 松手掉落</p>
<div class="fruits-row">
  <span class="fruit-dot">🍒×2=🍓</span><span class="fruit-dot">🍓×2=🍇</span><span class="fruit-dot">🍇×2=🍊</span>
  <span class="fruit-dot">🍊×2=🍋</span><span class="fruit-dot">🍋×2=🍎</span><span class="fruit-dot">🍎×2=🍐</span>
  <span class="fruit-dot">🍐×2=🍑</span><span class="fruit-dot">🍑×2=🍍</span><span class="fruit-dot">🍍×2=🍈</span>
  <span class="fruit-dot">🍈×2=🍉</span>
</div>

<script>
// ── Audio engine ──
var ac=null;
function ai(){if(!ac||ac.state==='closed'){ac=new(window.AudioContext||window.webkitAudioContext)();}
  if(ac.state==='suspended')ac.resume();}
function pt(f,d,t,v,dl){
  try{ai();if(!ac)return;
    var o=ac.createOscillator(),g=ac.createGain();
    var t0=(dl||0)+ac.currentTime;
    o.type=t||'sine';
    o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(v||0.06,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+Math.max(d,0.03));
    o.connect(g);g.connect(ac.destination);
    o.start(t0);o.stop(t0+Math.max(d,0.05));
  }catch(e){}}

// Sound effects
var sndLastBump=0;
function sndDrop(type){
  ai();var f=220+(type+1)*40;pt(f,0.12,'sine',0.05);
}
function sndMerge(type){
  ai();var base=330+type*60;
  pt(base,0.15,'sine',0.08);pt(base*1.25,0.12,'sine',0.06,0.06);pt(base*1.5,0.15,'sine',0.08,0.12);
}
function sndBump(force){
  if(Date.now()-sndLastBump<100)return;sndLastBump=Date.now();
  var f=80+force*30;pt(f,0.06,'square',Math.min(0.04,force*0.01));
}
function sndGameOver(){
  pt(200,0.3,'sawtooth',0.1);pt(150,0.3,'sawtooth',0.08,0.2);pt(80,0.5,'sawtooth',0.06,0.4);
}
function sndNewBest(){
  var ns=[523,659,784,1047,1319];
  for(var i=0;i<5;i++)pt(ns[i],0.18,'sine',0.08,i*0.12);
}

// ── Leaderboard ──
var LB_KEY='wm_leaderboard';
function loadLB(){try{return JSON.parse(localStorage.getItem(LB_KEY)||'[]');}catch(e){return[];}}
function saveLB(arr){localStorage.setItem(LB_KEY,JSON.stringify(arr.slice(0,8)));}
function addScore(s){
  var lb=loadLB();lb.push({s:s,t:Date.now()});lb.sort(function(a,b){return b.s-a.s;});lb=lb.slice(0,8);saveLB(lb);return lb;
}
function isNewBest(s){
  var lb=loadLB();return lb.length<8||s>lb[lb.length-1].s;
}
function renderLB(lb,highlightScore){
  var el=document.getElementById('leaderboard');
  var h='<div class="lb-title">🏆 排行榜</div>';
  var ranks=['🥇','🥈','🥉','4','5','6','7','8'];
  for(var i=0;i<lb.length;i++){
    var cls=lb[i].s===highlightScore?'lb-row highlight':'lb-row';
    h+='<div class="'+cls+'"><span class="lb-rank">'+ranks[i]+'</span><span class="lb-score">'+lb[i].s+'</span></div>';
  }
  el.innerHTML=h;
}

// ── Game engine ──
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('gameWrap');
const scoreEl=document.getElementById('score'),nextEl=document.getElementById('nextFruit');
const overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore');
const restartBtn=document.getElementById('restartBtn');

var CW,CH,score=0,gs='playing',newBest=false;
var bodies=[],curBody=null,nextType=0,dragX=0,dropReady=false,lastDrop=0;

const FRUITS=[
  {r:14,emoji:'🍒',color:'#dc2626',score:1,name:'cherry'},
  {r:20,emoji:'🍓',color:'#e11d48',score:3,name:'strawberry'},
  {r:26,emoji:'🍇',color:'#7c3aed',score:6,name:'grape'},
  {r:32,emoji:'🍊',color:'#f97316',score:10,name:'orange'},
  {r:37,emoji:'🍋',color:'#eab308',score:15,name:'lemon'},
  {r:43,emoji:'🍎',color:'#ef4444',score:21,name:'apple'},
  {r:49,emoji:'🍐',color:'#84cc16',score:28,name:'pear'},
  {r:56,emoji:'🍑',color:'#f97316',score:36,name:'peach'},
  {r:64,emoji:'🍍',color:'#eab308',score:45,name:'pineapple'},
  {r:76,emoji:'🍈',color:'#22c55e',score:55,name:'melon'},
  {r:90,emoji:'🍉',color:'#16a34a',score:70,name:'watermelon'},
];

function resize(){
  const w=Math.min(wrap.clientWidth-4,420);
  CW=w;CH=Math.round(w/0.55);
  canvas.width=CW;canvas.height=CH;
}
resize();window.addEventListener('resize',resize);

function lerp(a,b,t){return a+(b-a)*t;}

function createBody(type,x,y,vx,vy){
  var f=FRUITS[type];var sc=CW/420;
  var b={x:x,y:y,r:f.r*sc,type:type,vy:vy||0,vx:vx||0,
    active:true,merged:false,justSpawned:true,damp:0.98,restitution:0.3,groundCount:0};
  bodies.push(b);return b;
}

function spawnDrop(){
  if(gs!=='playing')return;
  if(nextType===undefined)nextType=Math.floor(Math.random()*5);
  curBody=createBody(nextType,CW/2,-60,0,4);
  curBody.isHeld=true;curBody.vy=0;curBody.justSpawned=false;
  dragX=CW/2;dropReady=true;
  var maxT=Math.min(4+Math.floor(score/50),10);
  nextType=Math.floor(Math.random()*maxT);
  nextEl.textContent=FRUITS[nextType].emoji;
  sndDrop(curBody.type);
}

function dropBody(){
  if(!curBody||!dropReady)return;
  if(Date.now()-lastDrop<400)return;
  lastDrop=Date.now();
  curBody.isHeld=false;curBody.vy=5;
  dropReady=false;
  setTimeout(spawnDrop,600);
}

// ── Physics ──
function step(){
  if(gs!=='playing')return;
  for(var i=0;i<2;i++){
    for(var j=0;j<bodies.length;j++){
      var b=bodies[j];if(!b.active)continue;
      if(b.isHeld){b.x=lerp(b.x,dragX,0.25);b.y=-50;continue;}
      b.vy+=0.55;b.x+=b.vx;b.y+=b.vy;
      if(b.x-b.r<0){b.x=b.r;b.vx*= -0.3;sndBump(0.5);}
      if(b.x+b.r>CW){b.x=CW-b.r;b.vx*= -0.3;sndBump(0.5);}
      if(b.y+b.r>CH){b.y=CH-b.r;b.vy*= -0.15;b.vx*=0.9;b.groundCount++;sndBump(0.8);}
      if(b.y-b.r<0&&!b.isHeld){b.y=b.r;b.vy=Math.abs(b.vy)*0.2;}
      b.vx*=b.damp;b.vy*=b.damp;b.justSpawned=false;
      if(!b.merged&&!b.justSpawned&&b.groundCount>3&&b.y<CH*0.12){endGame();return;}
    }
    for(var j=0;j<bodies.length;j++){
      for(var k=j+1;k<bodies.length;k++){
        var a=bodies[j],b2=bodies[k];
        if(!a.active||!b2.active||a.isHeld||b2.isHeld)continue;
        var dx=b2.x-a.x,dy=b2.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
        var minDist=a.r+b2.r;
        if(dist<minDist&&dist>0){
          var overlap=minDist-dist,nx=dx/dist,ny=dy/dist;
          a.x-=nx*overlap*0.5;a.y-=ny*overlap*0.5;
          b2.x+=nx*overlap*0.5;b2.y+=ny*overlap*0.5;
          var relVn=(b2.vx-a.vx)*nx+(b2.vy-a.vy)*ny;
          if(relVn<0){var imp=relVn*0.7;a.vx+=imp*nx*0.5;a.vy+=imp*ny*0.5;b2.vx-=imp*nx*0.5;b2.vy-=imp*ny*0.5;}
          var impactF=Math.abs(relVn);
          if(impactF>2&&!a.merged&&!b2.merged)sndBump(Math.min(1,impactF/8));
          if(a.type===b2.type&&!a.merged&&!b2.merged&&a.type<FRUITS.length-1){
            a.merged=true;b2.merged=true;a.active=false;b2.active=false;
            var nt=a.type+1,mx=(a.x+b2.x)/2,my=(a.y+b2.y)/2;
            var nb=createBody(nt,mx,my,0,-2);nb.justSpawned=false;
            score+=FRUITS[nt].score;updateScore();
            spawnParts(mx,my,FRUITS[nt].color);
            sndMerge(nt);
          }
        }
      }
    }
  }
  bodies=bodies.filter(function(b){return b.active;});
}

var parts=[];
function spawnParts(x,y,color){
  for(var i=0;i<10;i++){
    var a=Math.random()*Math.PI*2,sp=Math.random()*4+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+Math.random()*12,r:2+Math.random()*3,c:color});
  }
}

function updateScore(){scoreEl.textContent=score;}

function endGame(){
  gs='over';finalScore.textContent=score;sndGameOver();
  var lb=addScore(score);renderLB(lb,score);
  var bestEl=document.getElementById('newBestFlag');
  if(score>=lb[0].s){newBest=true;sndNewBest();}
  overlay.classList.add('show');
}

function restart(){
  bodies=[];parts=[];score=0;gs='playing';newBest=false;
  curBody=null;dropReady=false;nextType=Math.floor(Math.random()*5);
  nextEl.textContent=FRUITS[nextType].emoji;
  updateScore();overlay.classList.remove('show');
  renderLB(loadLB(),-1);
  spawnDrop();
}

// ── Render ──
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='rgba(255,255,255,0.015)';ctx.lineWidth=0.5;
  for(var i=0;i<CW;i+=30){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,CH);ctx.stroke();}
  for(var i=0;i<CH;i+=30){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(CW,i);ctx.stroke();}
  var dlY=CH*0.15;
  ctx.fillStyle='rgba(239,68,68,0.03)';ctx.fillRect(0,0,CW,dlY);
  ctx.strokeStyle='rgba(239,68,68,0.18)';ctx.lineWidth=1;
  ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(0,dlY);ctx.lineTo(CW,dlY);ctx.stroke();ctx.setLineDash([]);

  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];if(!b.active)continue;
    var f=FRUITS[b.type],r=b.r;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.arc(b.x+2,b.y+2,r,0,Math.PI*2);ctx.fill();
    var grad=ctx.createRadialGradient(b.x-r*0.3,b.y-r*0.3,r*0.1,b.x,b.y,r);
    grad.addColorStop(0,'rgba(255,255,255,0.25)');
    grad.addColorStop(0.5,f.color);grad.addColorStop(1,'rgba(0,0,0,0.2)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.stroke();
    ctx.font='bold '+Math.round(r*1.2)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=2;ctx.fillText(f.emoji,b.x,b.y+1);ctx.shadowBlur=0;
  }

  if(curBody&&curBody.isHeld&&dropReady){
    var f=FRUITS[curBody.type],r=curBody.r,x=curBody.x,y=curBody.y;
    if(y<r)y=r;y=Math.max(-20,y);
    ctx.globalAlpha=0.85;
    var g2=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    g2.addColorStop(0,'rgba(255,255,255,0.3)');g2.addColorStop(0.5,f.color);g2.addColorStop(1,'rgba(0,0,0,0.2)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
    ctx.font='bold '+Math.round(r*1.2)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=3;ctx.fillText(f.emoji,x,y+1);ctx.shadowBlur=0;
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.5;
    ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();ctx.setLineDash([]);
  }

  for(var i=0;i<parts.length;i++){
    var p=parts[i];ctx.globalAlpha=p.life/30;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  parts=parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});
}

// ── Input ──
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();ai();
  if(gs!=='playing'){restart();return;}
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  dragX=(t.clientX-r.left)/r.width*CW;
  if(!dropReady)spawnDrop();
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!dropReady||!curBody)return;
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  dragX=(t.clientX-r.left)/r.width*CW;
},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();dropBody();},{passive:false});
canvas.addEventListener('mousedown',function(e){
  ai();if(gs!=='playing'){restart();return;}
  var r=canvas.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*CW;
  if(!dropReady)spawnDrop();
});
canvas.addEventListener('mousemove',function(e){
  if(!dropReady||!curBody)return;
  var r=canvas.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*CW;
});
canvas.addEventListener('mouseup',function(e){dropBody();});
restartBtn.addEventListener('click',function(e){e.stopPropagation();restart();});

// ── Init ──
renderLB(loadLB(),-1);
spawnDrop();
function loop(){step();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
