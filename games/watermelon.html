<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍉 合成大西瓜</title>
<style>
:root{--bg:#1a1a2e;--surface:rgba(255,255,255,0.04);--text:#e8e8f0;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,8px) 8px 0;}
.top-bar{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;padding:6px 4px;flex-shrink:0;}
.back-btn{color:var(--text);opacity:0.5;text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;}
.back-btn:active{opacity:0.8;}
.title{font-size:19px;font-weight:800;letter-spacing:-0.3px;}
.title span{background:linear-gradient(135deg,#f97316,#ef4444,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.score-box{font-size:13px;font-weight:700;color:#f97316;background:rgba(249,115,22,0.1);padding:7px 14px;border-radius:16px;border:1px solid rgba(249,115,22,0.15);}
.game-wrap{position:relative;width:100%;max-width:420px;aspect-ratio:0.55;margin:4px 0;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);background:#0f0f1a;}
canvas{display:block;width:100%;height:100%;}
.next-preview{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.next-label{font-size:10px;opacity:0.4;font-weight:600;}
.next-fruit{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(6,6,20,0.8);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.overlay.show{display:flex;}
.overlay-emoji{font-size:48px;}
.overlay-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.overlay-score{font-size:15px;opacity:0.6;}
.overlay-btn{padding:12px 36px;border-radius:24px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-weight:800;font-size:16px;border:none;cursor:pointer;transition:all 0.12s;}
.overlay-btn:active{transform:scale(0.92);}
.ctrl-hint{font-size:11px;opacity:0.25;padding:4px 0;flex-shrink:0;}
.fruits-row{display:flex;gap:4px;padding:4px 0;flex-shrink:0;flex-wrap:wrap;justify-content:center;}
.fruit-dot{font-size:16px;opacity:0.4;}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="title"><span>🍉 合成大西瓜</span></div>
  <div class="score-box">🏆 <span id="score">0</span></div>
</div>
<div class="game-wrap" id="gameWrap">
  <canvas id="gc"></canvas>
  <div class="next-preview"><span class="next-label">NEXT</span><span class="next-fruit" id="nextFruit">🍒</span></div>
  <div class="overlay" id="overlay">
    <div class="overlay-emoji">🍉</div>
    <div class="overlay-title">Game Over</div>
    <div class="overlay-score">得分: <span id="finalScore">0</span></div>
    <button class="overlay-btn" id="restartBtn">🔄 再来一次</button>
  </div>
</div>
<p class="ctrl-hint">👆 左右拖动选择位置 · 松手掉落</p>
<div class="fruits-row">
  <span class="fruit-dot">🍒×2=🍓</span><span class="fruit-dot">🍓×2=🍇</span><span class="fruit-dot">🍇×2=🍊</span>
  <span class="fruit-dot">🍊×2=🍋</span><span class="fruit-dot">🍋×2=🍎</span><span class="fruit-dot">🍎×2=🍐</span>
  <span class="fruit-dot">🍐×2=🍑</span><span class="fruit-dot">🍑×2=🍍</span><span class="fruit-dot">🍍×2=🍈</span>
  <span class="fruit-dot">🍈×2=🍉</span>
</div>

<script>
// ── Game Engine: Lightweight physics + canvas ──
const canvas=document.getElementById('gc'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('gameWrap');
const scoreEl=document.getElementById('score'),nextEl=document.getElementById('nextFruit');
const overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore');
const restartBtn=document.getElementById('restartBtn');

var CW,CH,score=0,best=0,gs='playing';
var bodies=[],curBody=null,nextType=0,dragX=0,dropReady=false,lastDrop=0;

const FRUITS=[
  {r:14,emoji:'🍒',color:'#dc2626',score:1,name:'cherry'},
  {r:20,emoji:'🍓',color:'#e11d48',score:3,name:'strawberry'},
  {r:26,emoji:'🍇',color:'#7c3aed',score:6,name:'grape'},
  {r:32,emoji:'🍊',color:'#f97316',score:10,name:'orange'},
  {r:37,emoji:'🍋',color:'#eab308',score:15,name:'lemon'},
  {r:43,emoji:'🍎',color:'#ef4444',score:21,name:'apple'},
  {r:49,emoji:'🍐',color:'#84cc16',score:28,name:'pear'},
  {r:56,emoji:'🍑',color:'#f97316',score:36,name:'peach'},
  {r:64,emoji:'🍍',color:'#eab308',score:45,name:'pineapple'},
  {r:76,emoji:'🍈',color:'#22c55e',score:55,name:'melon'},
  {r:90,emoji:'🍉',color:'#16a34a',score:70,name:'watermelon'},
];

function resize(){
  const w=Math.min(wrap.clientWidth-4,420);
  CW=w;CH=Math.round(w/0.55);
  canvas.width=CW;canvas.height=CH;
}
resize();window.addEventListener('resize',resize);

function lerp(a,b,t){return a+(b-a)*t;}

function createBody(type,x,y,vx,vy){
  var f=FRUITS[type];
  var b={
    x:x,y:y,r:f.r*(CW/420),type:type,vy:vy||0,vx:vx||0,
    active:true,merged:false,justSpawned:true,
    damp:0.98,restitution:0.3,groundCount:0
  };
  bodies.push(b);
  return b;
}

function spawnDrop(){
  if(gs!=='playing')return;
  var type=nextType;
  if(type===undefined)type=Math.floor(Math.random()*5);
  curBody=createBody(type,CW/2,-60,0,4);
  curBody.isHeld=true;
  curBody.vy=0;
  curBody.justSpawned=false;
  dragX=CW/2;
  dropReady=true;
  // pick next
  var maxT=Math.min(4+Math.floor(score/50),10);
  nextType=Math.floor(Math.random()*maxT);
  nextEl.textContent=FRUITS[nextType].emoji;
}

function dropBody(){
  if(!curBody||!dropReady)return;
  if(Date.now()-lastDrop<300)return;
  lastDrop=Date.now();
  curBody.isHeld=false;
  curBody.vy=5;
  dropReady=false;
  setTimeout(spawnDrop,500);
}

// ── Physics step ──
function step(){
  if(gs!=='playing')return;
  for(var i=0;i<3;i++){ // sub-steps for stability
    for(var j=0;j<bodies.length;j++){
      var b=bodies[j];
      if(!b.active)continue;
      if(b.isHeld){
        b.x=lerp(b.x,dragX,0.25);
        b.y=-50;
        continue;
      }
      b.vy+=0.6; // gravity
      b.x+=b.vx;
      b.y+=b.vy;
      // Walls
      if(b.x-b.r<0){b.x=b.r;b.vx*= -0.3;}
      if(b.x+b.r>CW){b.x=CW-b.r;b.vx*= -0.3;}
      if(b.y+b.r>CH){
        b.y=CH-b.r;
        b.vy*= -0.2;
        b.vx*=0.9;
        b.groundCount++;
      }
      if(b.y-b.r<0&&!b.isHeld){b.y=b.r;b.vy=Math.abs(b.vy)*0.2;}
      b.vx*=b.damp;
      b.vy*=b.damp;
      b.justSpawned=false;

      // Game over check - fruit resting above line
      if(!b.merged&&!b.justSpawned&&b.groundCount>5&&b.y<CH*0.15){
        endGame();
        return;
      }
    }
    // Collision detection
    for(var j=0;j<bodies.length;j++){
      for(var k=j+1;k<bodies.length;k++){
        var a=bodies[j],b2=bodies[k];
        if(!a.active||!b2.active)continue;
        if(a.isHeld||b2.isHeld)continue;
        var dx=b2.x-a.x,dy=b2.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
        var minDist=a.r+b2.r;
        if(dist<minDist&&dist>0){
          // Separate
          var overlap=minDist-dist;
          var nx=dx/dist,ny=dy/dist;
          a.x-=nx*overlap*0.5;
          a.y-=ny*overlap*0.5;
          b2.x+=nx*overlap*0.5;
          b2.y+=ny*overlap*0.5;
          // Velocity exchange
          var relVx=b2.vx-a.vx,relVy=b2.vy-a.vy;
          var relVn=relVx*nx+relVy*ny;
          if(relVn<0){
            var imp=relVn*0.8;
            a.vx+=imp*nx*0.5;
            a.vy+=imp*ny*0.5;
            b2.vx-=imp*nx*0.5;
            b2.vy-=imp*ny*0.5;
          }
          // Merge if same type
          if(a.type===b2.type&&!a.merged&&!b2.merged&&a.type<FRUITS.length-1){
            a.merged=true;b2.merged=true;a.active=false;b2.active=false;
            var newType=a.type+1;
            var mx=(a.x+b2.x)/2,my=(a.y+b2.y)/2;
            var nb=createBody(newType,mx,my,0,-2);
            nb.justSpawned=false;
            score+=FRUITS[newType].score;
            updateScore();
            // Particle effect
            spawnParts(mx,my,FRUITS[newType].color);
          }
        }
      }
    }
  }
  bodies=bodies.filter(function(b){return b.active;});
}

var parts=[];
function spawnParts(x,y,color){
  for(var i=0;i<8;i++){
    var a=Math.random()*Math.PI*2,sp=Math.random()*4+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:15+Math.random()*10,r:2+Math.random()*3,c:color});
  }
}

function updateScore(){
  scoreEl.textContent=score;
}

function endGame(){
  gs='over';
  finalScore.textContent=score;
  if(score>best)best=score;
  overlay.classList.add('show');
}

function restart(){
  bodies=[];parts=[];score=0;gs='playing';
  curBody=null;dropReady=false;nextType=Math.floor(Math.random()*5);
  nextEl.textContent=FRUITS[nextType].emoji;
  updateScore();
  overlay.classList.remove('show');
  spawnDrop();
}

// ── Render ──
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,CW,CH);

  // Grid pattern
  ctx.strokeStyle='rgba(255,255,255,0.02)';
  ctx.lineWidth=0.5;
  for(var i=0;i<CW;i+=30){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,CH);ctx.stroke();}
  for(var i=0;i<CH;i+=30){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(CW,i);ctx.stroke();}

  // Danger line
  var dlY=CH*0.2;
  ctx.fillStyle='rgba(239,68,68,0.04)';ctx.fillRect(0,0,CW,dlY);
  ctx.strokeStyle='rgba(239,68,68,0.2)';ctx.lineWidth=1;
  ctx.setLineDash([8,12]);ctx.beginPath();ctx.moveTo(0,dlY);ctx.lineTo(CW,dlY);ctx.stroke();ctx.setLineDash([]);

  // Draw bodies
  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];
    if(!b.active)continue;
    var f=FRUITS[b.type];
    var r=b.r;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.arc(b.x+2,b.y+2,r,0,Math.PI*2);ctx.fill();

    // Body
    var grad=ctx.createRadialGradient(b.x-r*0.3,b.y-r*0.3,r*0.1,b.x,b.y,r);
    grad.addColorStop(0,'rgba(255,255,255,0.2)');
    grad.addColorStop(0.5,f.color);
    grad.addColorStop(1,'rgba(0,0,0,0.2)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();

    // Outline
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.stroke();

    // Emoji
    var fs=r*1.2;
    ctx.font='bold '+fs+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3;
    ctx.fillText(f.emoji,b.x,b.y+1);
    ctx.shadowBlur=0;
  }

  // Held fruit at top
  if(curBody&&curBody.isHeld&&dropReady){
    var f=FRUITS[curBody.type];
    var r=curBody.r;
    var x=curBody.x,y=curBody.y;
    if(y<r)y=r;
    y=Math.max(-20,y);
    ctx.globalAlpha=0.85;
    var g2=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    g2.addColorStop(0,'rgba(255,255,255,0.3)');
    g2.addColorStop(0.5,f.color);
    g2.addColorStop(1,'rgba(0,0,0,0.2)');
    ctx.fillStyle=g2;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
    var fs2=r*1.2;
    ctx.font='bold '+fs2+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
    ctx.fillText(f.emoji,x,y+1);
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;

    // Drop guide line
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;
    ctx.setLineDash([4,8]);
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Particles
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=p.life/25;
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Update particles
  parts=parts.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;
    return p.life>0;
  });
}

// ── Input ──
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(gs!=='playing'){restart();return;}
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  dragX=(t.clientX-r.left)/r.width*CW;
  if(!dropReady)spawnDrop();
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!dropReady||!curBody)return;
  var t=e.touches[0],r=canvas.getBoundingClientRect();
  dragX=(t.clientX-r.left)/r.width*CW;
  dragX=Math.max(FRUITS[curBody.type].r,dragX-25);
  dragX=Math.min(CW-FRUITS[curBody.type].r,dragX+25);
},{passive:false});

canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  dropBody();
},{passive:false});

canvas.addEventListener('mousedown',function(e){
  if(gs!=='playing'){restart();return;}
  var r=canvas.getBoundingClientRect();
  dragX=(e.clientX-r.left)/r.width*CW;
  if(!dropReady)spawnDrop();
});
canvas.addEventListener('mousemove',function(e){
  if(!dropReady||!curBody)return;
  var r=canvas.getBoundingClientRect();
  dragX=(e.clientX-r.left)/r.width*CW;
});
canvas.addEventListener('mouseup',function(e){dropBody();});

restartBtn.addEventListener('click',function(e){e.stopPropagation();restart();});

// ── Game loop ──
function loop(){
  step();
  draw();
  requestAnimationFrame(loop);
}

spawnDrop();loop();
</script>
</body>
</html>
