<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎵 节奏点按</title>
<style>
:root{--bg:#0a0a12;--surface:rgba(255,255,255,0.04);--text:#f0f0f5;--accent:#8b5cf6;--accent-dim:rgba(139,92,246,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
body{padding:env(safe-area-inset-top,12px) 12px env(safe-area-inset-bottom,12px);display:flex;flex-direction:column;align-items:center;}
.top-bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--text);opacity:0.6;text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:12px;}
.back-btn:active{background:var(--surface);opacity:1;}
.game-title{font-size:20px;font-weight:800;}
.game-title span{background:linear-gradient(135deg,#8b5cf6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.score-display{font-size:14px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:8px 16px;border-radius:20px;}
.game-container{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative;}
canvas{background:#0f0f1a;border-radius:16px;border:1px solid rgba(255,255,255,0.06);max-width:100%;max-height:100%;box-shadow:0 0 40px rgba(139,92,246,0.06);}
.status-row{display:flex;gap:12px;padding:8px 0;flex-shrink:0;align-items:center;}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.status-dot.green{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,0.6);}
.status-dot.red{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,0.6);}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.overlay.show{display:flex;}
.overlay-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.overlay-score{font-size:16px;opacity:0.7;}
.overlay-btn{background:var(--accent);color:#000;font-weight:800;padding:14px 40px;border-radius:30px;font-size:16px;border:none;cursor:pointer;}
.overlay-btn:active{transform:scale(0.95);}
.combo{font-size:24px;font-weight:900;color:#fbbf24;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:all 0.3s;}
.combo.show{opacity:1;transform:translate(-50%,-70%) scale(1.2);}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back-btn" href="../index.html">‹ 返回</a>
  <div class="game-title"><span>🎵 节奏点按</span></div>
  <div class="score-display">🏆 <span id="score">0</span></div>
</div>
<div class="game-container">
  <canvas id="gameCanvas"></canvas>
  <div class="combo" id="comboText"></div>
</div>
<div class="status-row">
  <span id="comboCount">🔥 连击 0</span>
  <span id="timing" style="font-size:13px;color:rgba(255,255,255,0.4);">✨ 完美</span>
</div>
<div class="overlay" id="gameOver">
  <div class="overlay-title">🎵 曲终</div>
  <div class="overlay-score">得分: <span id="finalScore">0</span> · 最高连击: <span id="maxCombo">0</span></div>
  <button class="overlay-btn" id="restartBtn">🔄 再来一曲</button>
</div>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),finalScoreEl=document.getElementById('finalScore');
const comboCountEl=document.getElementById('comboCount'),timingEl=document.getElementById('timing');
const maxComboEl=document.getElementById('maxCombo'),comboText=document.getElementById('comboText');
const overlay=document.getElementById('gameOver'),restartBtn=document.getElementById('restartBtn');
let W,H,notes=[],score=0,combo=0,maxCombo=0,laneW,animId,running,speed,spawnTimer,noteId=0;
const lanes=4,colors=['#ef4444','#f59e0b','#10b981','#8b5cf6'];

function resize(){
  const c=canvas.parentElement;
  const s=Math.min(c.clientWidth-8,c.clientHeight-8,400);
  canvas.width=canvas.height=s;W=s;H=s;laneW=s/lanes;
}

function init(){
  resize();score=0;combo=0;maxCombo=0;notes=[];noteId=0;
  scoreEl.textContent='0';comboCountEl.textContent='🔥 连击 0';
  overlay.classList.remove('show');running=true;speed=H/1.8;
  if(animId)cancelAnimationFrame(animId);
  spawnTimer=performance.now();
  loop(0);
}

function spawnNote(){
  const lane=Math.floor(Math.random()*lanes);
  notes.push({id:noteId++,lane,x:lane*laneW+laneW/2,y:-20,w:laneW*0.7,h:18,hit:false});
}

function getScore(dist){
  if(dist<8)return{pts:100,label:'✨ 完美',comboDelta:1};
  if(dist<18)return{pts:60,label:'👍 不错',comboDelta:1};
  if(dist<30)return{pts:20,label:'👌 还行',comboDelta:1};
  return{pts:0,label:'💔 错过',comboDelta:-1};
}

function hitLane(lane){
  if(!running)return;
  let closest=null,minDist=Infinity;
  for(const n of notes){
    if(n.hit||n.lane!==lane)continue;
    const dist=Math.abs(n.y-(H*0.85));
    if(dist<minDist){minDist=dist;closest=n;}
  }
  if(!closest||minDist>40){combo=0;comboCountEl.textContent='🔥 连击 0';timingEl.textContent='💔 落空';return;}
  const result=getScore(minDist);
  closest.hit=true;
  if(result.comboDelta>0)combo++;else combo=0;
  if(combo>maxCombo)maxCombo=combo;
  score+=result.pts*Math.max(1,Math.floor(combo/5)+1);
  scoreEl.textContent=score;
  comboCountEl.textContent='🔥 连击 '+combo;
  timingEl.textContent=result.label;
  if(result.pts>=60){
    comboText.textContent='🔥x'+combo;
    comboText.classList.remove('show');
    void comboText.offsetWidth;
    comboText.classList.add('show');
    setTimeout(()=>comboText.classList.remove('show'),400);
  }
  try{
    const actx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=actx.createOscillator(),gain=actx.createGain();
    osc.connect(gain);gain.connect(actx.destination);
    osc.frequency.value=440+closest.lane*110;
    osc.type='sine';gain.gain.value=0.15;
    osc.start();osc.stop(actx.currentTime+0.1);
  }catch(e){}
}

function update(dt){
  if(!running)return;
  if(performance.now()-spawnTimer>600-speed/4){spawnNote();spawnTimer=performance.now();}
  for(const n of notes){
    if(n.hit)continue;
    n.y+=speed*dt;
    if(n.y>H+30){n.hit=true;combo=0;comboCountEl.textContent='🔥 连击 0';timingEl.textContent='💔 漏了';}
  }
  notes=notes.filter(n=>!n.hit||n.y>-50);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f0f1a';ctx.beginPath();ctx.roundRect(0,0,W,H,16);ctx.fill();
  // lanes
  for(let i=0;i<lanes;i++){
    ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(i*laneW,0);ctx.lineTo(i*laneW,H);ctx.stroke();
  }
  // hit zone
  ctx.fillStyle='rgba(139,92,246,0.08)';
  ctx.fillRect(0,H*0.85-12,W,24);
  ctx.strokeStyle='rgba(139,92,246,0.2)';ctx.lineWidth=1;
  ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,H*0.85);ctx.lineTo(W,H*0.85);ctx.stroke();
  ctx.setLineDash([]);
  // notes
  for(const n of notes){
    if(n.hit)continue;
    ctx.shadowColor=colors[n.lane];ctx.shadowBlur=10;
    ctx.fillStyle=colors[n.lane];
    ctx.beginPath();ctx.roundRect(n.x-n.w/2,n.y-n.h/2,n.w,n.h,6);ctx.fill();
    ctx.shadowBlur=0;
  }
}

let lastT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  if(t>0){update(dt);draw();}
  animId=requestAnimationFrame(loop);
}

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width;
  hitLane(Math.floor(x/laneW));
});

canvas.addEventListener('touchstart',e=>{
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const x=(t.clientX-r.left)*W/r.width;
  hitLane(Math.floor(x/laneW));
},{passive:true});

document.addEventListener('keydown',e=>{
  const map={1:0,2:1,3:2,4:3};
  if(map[e.key]!==undefined)hitLane(map[e.key]);
});

restartBtn.addEventListener('click',init);
window.addEventListener('resize',()=>{resize();draw();});
init();
</script>
</body>
</html>
